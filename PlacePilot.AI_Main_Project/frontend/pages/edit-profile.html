<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - PlacePilot AI</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <h2>Edit Profile</h2>
    <div class="profile-icon"></div>
</div>

<div class="edit-profile-container">

    <h1 class="center-title">Update Your Profile</h1>

    <!-- Profile Image -->
    <div class="profile-upload">
        <div class="profile-circle"></div>
        <input type="file">
    </div>

    <form onsubmit="return saveProfile(event)">

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" placeholder="Enter your phone number">
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select>
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Enter your location">
        </div>

        <div class="form-group">
            <label>Work</label>
            <input type="text" placeholder="Your current role">
        </div>

        <div class="form-group">
            <label>Education</label>
            <input type="text" placeholder="Your qualification">
        </div>

        <div class="form-group">
            <label>Skills</label>
            <input type="text" placeholder="e.g. Java, DSA, Web Dev">
        </div>

        <div class="form-group">
            <label>Bio</label>
            <textarea placeholder="Short description about you"></textarea>
        </div>

        <button type="submit" class="save-btn">Save Changes</button>

    </form>

</div>
    <script src="../js/script.js"></script>
</body>
</html>
